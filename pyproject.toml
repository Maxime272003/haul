[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haul"
dynamic = ["version"]
description = "Gestionnaire de téléchargements FuckingFast : presse-papier, multi-connexions, analyse VirusTotal et extraction WinRAR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxime272003", email = "rousseaumaxime27@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "curl_cffi>=0.7",   # téléchargement (empreinte TLS de Chrome, requise par Cloudflare)
    "requests>=2.31",   # vtzip : API VirusTotal
    "rich>=13.7",       # vtzip : rendu des rapports
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6",
    "pillow>=10",       # génération de l'icône
]

[project.gui-scripts]
haul = "haul.__main__:main"

[project.scripts]
vtzip = "vtzip.cli:main"

[tool.setuptools.dynamic]
version = { attr = "haul.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haul = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # appels dans les valeurs par défaut (os.startfile)
    "E731",   # lambdas assignées, utilisées pour de petits callbacks
]
