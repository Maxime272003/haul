name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sur main, les fusions passent une par une : chaque release voit les tags des précédentes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installation
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags des releases précédentes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Numéro de version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = python scripts/next_version.py --write
          if ($LASTEXITCODE -ne 0) { throw "next_version.py a échoué" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $version"
      - name: Construction de Haul.exe
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[dev]"
          .\scripts\build.ps1
          $hash = (Get-FileHash dist\Haul.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Haul.exe" | Out-File -Encoding ascii dist\Haul.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Haul
          path: |
            dist/Haul.exe
            dist/Haul.exe.sha256

  # Chaque fusion sur main publie une release : Haul la trouve et se met à jour tout seul.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Haul
          path: dist
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/Haul.exe dist/Haul.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Haul $VERSION" --generate-notes
